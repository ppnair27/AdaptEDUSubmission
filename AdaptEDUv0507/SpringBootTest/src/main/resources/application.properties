spring.application.name=SpringBootTest
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

server.port=8080

# Serve static files from the AdaptEDU directory
spring.web.resources.static-locations=classpath:/static/

spring.main.allow-bean-definition-overriding=true

# Supabase connection values. Set these in your shell or deployment environment.
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.anon-key=${SUPABASE_ANON_KEY:}
supabase.tasks-table=${SUPABASE_TASKS_TABLE:task}
supabase.events-table=${SUPABASE_EVENTS_TABLE:event}
supabase.users-table=${SUPABASE_USERS_TABLE:users}

# Completely disable DevTools automatic restarts
spring.devtools.restart.enabled=false
